name: Build and Deploy Frontend on staging

on:
  push:
    branches:
      - integration
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-staging.yml'

env:
  REGISTRY: gitea.labnya-aska.my.id
  IMAGE_NAME: ${{ secrets.GITEA_USERNAME }}/ecohabbit-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_USE_MOCK=${{ vars.VITE_USE_MOCK || 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

