name: Build and Deploy Frontend on staging

on:
  push:
    branches:
      - integration
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"

env:
  REGISTRY: gitea.labnya-aska.my.id
  IMAGE_NAME: ${{ secrets.GITEA_USERNAME }}/ecohabbit-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_USE_MOCK=${{ vars.VITE_USE_MOCK || 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install and Start Cloudflare WARP (Proxy Mode)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp netcat-openbsd

          # Pastikan service warp-svc aktif
          sudo systemctl enable --now warp-svc
          sleep 3

          # Registrasi dan set proxy mode + port
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect

          # Tunggu sampai status Connected dan port 40000 benar-benar listening
          for i in {1..20}; do
            STATUS=$(warp-cli --accept-tos status || true)
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q "Connected" && ss -tln | grep -q ":40000"; then
              echo "WARP SOCKS5 Proxy is listening on 127.0.0.1:40000!"
              break
            fi
            sleep 2
          done

          # Cetak status akhir & port listening untuk debugging
          warp-cli --accept-tos status
          ss -tlnp | grep 40000 || true

      - name: Verify IPv6 via WARP Proxy
        run: |
          # Gunakan endpoint trace resmi Cloudflare yang pasti merespons IPv6 WARP
          curl -6 -s --socks5-hostname 127.0.0.1:40000 --connect-timeout 15 https://1.1.1.1/cdn-cgi/trace | grep -E "ip=|warp="

      - name: Deploy to IPv6 Server via SSH over WARP Proxy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="nc -X 5 -x 127.0.0.1:40000 %h %p" \
            "$SSH_USER@$SSH_HOST" << EOF
            set -e
            echo "$GITEA_TOKEN" | docker login $REGISTRY -u "$GITEA_USERNAME" --password-stdin
            docker pull $REGISTRY/$IMAGE_NAME:staging
            
            cd /opt/ecohabbit && docker compose up -d frontend
            docker image prune -f
          EOF
