name: Build and Deploy Frontend on staging

on:
  push:
    branches:
      - integration
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"

env:
  REGISTRY: gitea.labnya-aska.my.id
  IMAGE_NAME: ${{ secrets.GITEA_USERNAME }}/ecohabbit-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_USE_MOCK=${{ vars.VITE_USE_MOCK || 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup Cloudflare WARP for IPv6 Access
        uses: s-acs/cloudflare-warp-action@v1
        with:
          mode: warp # Memberikan konektivitas dual-stack (IPv4 + IPv6)

      - name: Verify IPv6 Connectivity
        run: |
          curl -6 -s --connect-timeout 5 https://ifconfig.co || true

      - name: Deploy to IPv6 Server via Native SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_USERNAME: ${{ secrets.GITEA_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -6 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -6 -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << EOF
            set -e
            echo "$GITEA_TOKEN" | docker login $REGISTRY -u "$GITEA_USERNAME" --password-stdin
            docker pull $REGISTRY/$IMAGE_NAME:staging
            
            cd /opt/ecohabbit && docker compose up -d frontend
            # Jika pakai K3s, uncomment baris di bawah dan hapus baris docker compose di atas:
            # kubectl rollout restart deployment/ecohabbit-frontend -n staging
            
            docker image prune -f
          EOF
